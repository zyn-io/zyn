[package]
name = "objectvm"
version = "0.1.0"
edition = "2021"

# The object ledger as a Zyn application, so the model can be proven end to end
# without touching swapvm. swapvm keeps chains 11 and 26460; this runs on the
# devnet chain and is free to break.
[dependencies]
zyn-vm = { path = "../zyn-vm" }
zyn-lend = { git = "https://github.com/zyn-io/zyn-lend.git", rev = "a6f1b70e029f8085f26d45d6b20621a2aa83cd0f" }
zyn = { path = "../zyn" }
