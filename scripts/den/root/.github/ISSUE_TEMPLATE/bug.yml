name: Bug
description: Something in a den or the page does not work as documented.
body:
  - type: markdown
    attributes:
      value: Anything that lets someone read a room, enter without a pass, act as another member, or take a den down is a vulnerability. Report it privately instead (SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The smallest set that shows it. Never paste a pass, invite link or day key.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag or commit (`docker compose images` in /opt/epeaky).
  - type: input
    id: where
    attributes:
      label: Server and browser
      description: e.g. Ubuntu 24.04 arm64, Firefox 140
