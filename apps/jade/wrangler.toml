# Jade (jade.zyn-network.com), Zyn's launchpad. Deploy from this folder:
#   wrangler pages deploy public --project-name zyn-jade --branch main
# `functions` are its Pages Functions; `public` is the page as served.
name = "zyn-jade"
pages_build_output_dir = "public"
compatibility_date = "2025-09-24"

# Pictures and descriptions coin creators attach (the store Cave Jade used).
[[kv_namespaces]]
binding = "JADE_CONTENT"
id = "6fec82c33ade4ebba5836456d67cdb04"
